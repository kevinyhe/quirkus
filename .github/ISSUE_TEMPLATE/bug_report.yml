name: Bug report
description: Something in Quirkus is broken or wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Quirkus version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: markdown
    attributes:
      value: Leave out anything private. Screenshots of Quercus or ACORN can show your name, marks, and student number.
