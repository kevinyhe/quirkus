[package]
name = "quirkus"
version = "0.1.2"
description = "Fast desktop client for U of T Quercus and ACORN, with an MCP server for AI assistants"
authors = ["Quirkus contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quirkus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "fs", "macros", "rt-multi-thread", "io-std", "io-util"] }
tauri-plugin-notification = "2.5.0"
futures-util = "0.3.34"
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "brotli", "http2", "stream", "cookies"] }
dirs = "7.0.0"
pdf-extract = "0.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
keyring = "4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
